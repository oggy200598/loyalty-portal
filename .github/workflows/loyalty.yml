name: Build validation
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: CI-Only!StrongPassword2026
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CI-Only!StrongPassword2026' -C -Q 'SELECT 1' -b"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SQLSERVER_AUTH: sql
      SQLSERVER_SERVER: localhost
      SQLSERVER_DATABASE: loyalty_ci
      SQLSERVER_USER: sa
      SQLSERVER_PASSWORD: CI-Only!StrongPassword2026
      SQLSERVER_TRUST_CERTIFICATE: "true"
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      REDIS_URL: redis://localhost:6379
      CHECKPOINT_DISABLE: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run build
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter build bundle --no-pub
